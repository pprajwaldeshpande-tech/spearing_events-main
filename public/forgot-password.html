<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Spearing Events</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
<nav class="navbar">
  <a href="index.html?home=member-cta-2" class="logo"><span>Spearing</span> Events</a>
  <ul class="nav-links"><li><a href="login.html">Login</a></li></ul>
</nav>
<main class="auth-wrapper">
  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title">Reset your password</h1>
    <p class="subtitle">Enter your account email. If it matches an active account, we will email a reset link that expires in one hour. Email delivery requires configured SMTP.</p>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" maxlength="254" required />
      </div>
      <button class="btn btn-primary" id="forgot-btn" type="submit">Send reset link</button>
    </form>
    <p class="switch"><a href="login.html">Return to login</a></p>
  </section>
</main>
<div id="toast-container"></div>
<script src="shared.js?v=7"></script>
<script src="api-client.js?v=8"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('forgot-btn');
    button.disabled = true;
    button.textContent = 'Sending...';
    try {
      const result = await EventSpot.requestPasswordReset(document.getElementById('email').value.trim());
      showToast(result.message, 'success');
      button.textContent = 'Request submitted';
    } catch (error) {
      showToast(error.message, 'error');
      button.disabled = false;
      button.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
