<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Choose a new password — Spearing Events</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
<nav class="navbar">
  <a href="index.html?home=member-cta-2" class="logo"><span>Spearing</span> Events</a>
  <ul class="nav-links"><li><a href="login.html">Login</a></li></ul>
</nav>
<main class="auth-wrapper">
  <section class="auth-card" aria-labelledby="reset-title">
    <h1 id="reset-title">Choose a new password</h1>
    <p class="subtitle">Use 10-72 characters and include at least one letter and one number.</p>
    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" minlength="10" maxlength="72" required />
      </div>
      <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" required />
      </div>
      <button class="btn btn-primary" id="reset-btn" type="submit">Reset password</button>
    </form>
    <p class="switch"><a href="login.html">Return to login</a></p>
  </section>
</main>
<div id="toast-container"></div>
<script src="shared.js?v=7"></script>
<script src="api-client.js?v=8"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token') || '';
  window.history.replaceState(null, '', window.location.pathname);
  if (!/^[a-f0-9]{64}$/.test(token)) {
    showToast('This password reset link is invalid or expired.', 'error');
    document.getElementById('reset-btn').disabled = true;
  }
  document.getElementById('reset-form').addEventListener('submit', async event => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('confirm').value) {
      showToast('Passwords do not match.', 'error');
      return;
    }
    const button = document.getElementById('reset-btn');
    button.disabled = true;
    button.textContent = 'Resetting...';
    try {
      const result = await EventSpot.resetPassword(token, password);
      showToast(result.message, 'success');
      setTimeout(() => window.location.href = 'login.html', 1200);
    } catch (error) {
      showToast(error.message, 'error');
      button.disabled = false;
      button.textContent = 'Reset password';
    }
  });
</script>
</body>
</html>
